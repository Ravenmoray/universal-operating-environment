name: UOE CLI prototype

on:
  push:
    branches:
      - main
      - prototype/portable-cli-v0
      - prototype/capability-claims-v0.2
    paths:
      - "uoe/**"
      - "tests/**"
      - "experiments/capability-graph/**"
      - ".github/workflows/uoe-prototype.yml"
  pull_request:
    paths:
      - "uoe/**"
      - "tests/**"
      - "experiments/capability-graph/**"
      - ".github/workflows/uoe-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-inspection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test inspect and plan without running supplied artifacts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Measure graph fan-out boundary (synthetic input)
        run: timeout 20s python3 tests/benchmark_graph.py
      - name: Check CLI help
        run: python3 -m uoe --help

  controlled-demo:
    # Never execute C files from an untrusted pull_request checkout.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: static-inspection-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run only the checked-in UOE-owned fixture
        run: |
          python3 -m uoe demo --execute-reviewed-fixture --export-dir /tmp/uoe-v02-demo-export > /tmp/uoe-demo-report.json
          python3 -m uoe plan /tmp/uoe-v02-demo-export/uoe-demo-client \
            --claims /tmp/uoe-v02-demo-export/claims.json \
            --graph /tmp/uoe-v02-demo-export/graph.json \
            --host-id host:linux-fixture > /tmp/uoe-v02-bound-plan.json
          python3 -c 'import json; p=json.load(open("/tmp/uoe-demo-report.json")); assert p["inspection"]["binary"]["format"] == "ELF"; assert p["verification"]["status"] == "passed"; assert p["plan"]["status"] == "candidates_found"; assert len(p["capability_graph"]["requirements"][0]["candidates"]) == 2'
          python3 -c 'import json; p=json.load(open("/tmp/uoe-v02-bound-plan.json")); assert p["capability_graph"]["status"] == "all_requirements_have_candidates"; assert p["capability_graph"]["evidence_authenticated"] is False'
      - uses: actions/upload-artifact@v4
        with:
          name: uoe-prototype-demo
          path: |
            /tmp/uoe-demo-report.json
            /tmp/uoe-v02-bound-plan.json
            /tmp/uoe-v02-demo-export/claims.json
            /tmp/uoe-v02-demo-export/graph.json
          if-no-files-found: error
          retention-days: 30
