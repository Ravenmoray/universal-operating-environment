name: Documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify foundations
        shell: bash
        run: |
          set -euo pipefail
          for f in LICENSE README.md VISION.md ROADMAP.md CONTRIBUTING.md SECURITY.md AGENTS.md docs/architecture/overview.md docs/rfcs/0001-artifact-execution.md; do
            test -s "$f"
          done
      - name: Check relative links, anchors and research-note reachability
        run: python3 -m unittest discover -s tests -p test_docs.py -v
