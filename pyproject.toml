[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uoe-experimental"
version = "0.1.0"
description = "UOE experimental binary inspector and read-only execution planner"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = []

[project.scripts]
uoe = "uoe.__main__:main"

[tool.setuptools]
packages = ["uoe"]
